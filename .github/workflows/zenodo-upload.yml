name: Upload to Zenodo

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  upload-to-zenodo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo (for .zenodo.json)
        uses: actions/checkout@v4

      - name: Download source zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/release-assets
          gh release download "${{ github.event.release.tag_name }}" \
            --repo "${{ github.repository }}" \
            --pattern "*.zip" \
            --dir /tmp/release-assets || true

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ github.event.release.tag_name }}" \
            --repo "${{ github.repository }}" \
            --pattern "document-*.pdf" \
            --pattern "checksums.txt" \
            --dir /tmp/release-assets || true

      - name: Debug — show files and secrets presence
        run: |
          echo "=== Release tag: ${{ github.event.release.tag_name }}"
          echo "=== Files to upload:"
          ls -la /tmp/release-assets/ 2>&1 || echo "(empty)"
          echo "=== .zenodo.json present: $([ -f .zenodo.json ] && echo YES || echo NO)"
          echo "=== ZENODO_TOKEN set: $([ -n '${{ secrets.ZENODO_TOKEN }}' ] && echo YES || echo NO)"
          echo "=== ZENODO_DEPOSITION_ID set: $([ -n '${{ secrets.ZENODO_DEPOSITION_ID }}' ] && echo YES || echo NO)"
          echo "=== ZENODO_DEPOSITION_ID value: ${{ secrets.ZENODO_DEPOSITION_ID }}"

      - name: Upload to Zenodo
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
          ZENODO_DEPOSITION_ID: ${{ secrets.ZENODO_DEPOSITION_ID }}
        run: |
          set -euxo pipefail
          ZENODO_URL="https://zenodo.org"

          echo "=== Creating new deposition version ==="
          echo "POST ${ZENODO_URL}/api/deposit/depositions/${ZENODO_DEPOSITION_ID}/actions/newversion"
          RESPONSE=$(curl -v -X POST \
            -H "Authorization: Bearer ${ZENODO_TOKEN}" \
            "${ZENODO_URL}/api/deposit/depositions/${ZENODO_DEPOSITION_ID}/actions/newversion" 2>&1)
          echo "$RESPONSE"
          NEW_DEPOSITION=$(echo "$RESPONSE" | jq -r '.links.latest_draft')

          if [ "$NEW_DEPOSITION" = "null" ] || [ -z "$NEW_DEPOSITION" ]; then
            echo "❌ Failed to create new version. Response above."
            exit 1
          fi

          DRAFT_ID=$(echo "$NEW_DEPOSITION" | grep -oP '\d+$')
          echo "Draft: $DRAFT_ID"

          echo "=== Getting bucket URL ==="
          BUCKET_URL=$(curl -sf \
            -H "Authorization: Bearer ${ZENODO_TOKEN}" \
            "${ZENODO_URL}/api/deposit/depositions/${DRAFT_ID}" \
            | jq -r '.links.bucket')
          echo "Bucket: $BUCKET_URL"

          echo "=== Clearing inherited files ==="
          EXISTING_FILES=$(curl -sf \
            -H "Authorization: Bearer ${ZENODO_TOKEN}" \
            "${ZENODO_URL}/api/deposit/depositions/${DRAFT_ID}" \
            | jq -r '.files[].id')

          for FILE_ID in $EXISTING_FILES; do
            echo "  Deleting $FILE_ID"
            curl -sf -X DELETE \
              -H "Authorization: Bearer ${ZENODO_TOKEN}" \
              "${ZENODO_URL}/api/deposit/depositions/${DRAFT_ID}/files/${FILE_ID}"
          done

          echo "=== Uploading source zip ==="
          SOURCE_ZIP=$(find /tmp/release-assets -name "*.zip" | head -1)
          if [ -n "$SOURCE_ZIP" ]; then
            echo "  Uploading $(basename "$SOURCE_ZIP")..."
            curl -sf -X PUT \
              -H "Authorization: Bearer ${ZENODO_TOKEN}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@${SOURCE_ZIP}" \
              "${BUCKET_URL}/$(basename "$SOURCE_ZIP")"
          else
            echo "  ⚠ No source zip found"
          fi

          echo "=== Uploading release assets ==="
          find /tmp/release-assets -maxdepth 1 -type f | while read -r FILE; do
            FILENAME=$(basename "$FILE")
            echo "  Uploading $FILENAME..."
            curl -sf -X PUT \
              -H "Authorization: Bearer ${ZENODO_TOKEN}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@${FILE}" \
              "${BUCKET_URL}/${FILENAME}"
          done

          echo "=== Setting metadata from .zenodo.json ==="
          METADATA=$(jq -n --slurpfile zenodo .zenodo.json '{
            metadata: $zenodo[0]
          }')

          echo "$METADATA" | jq '.metadata | keys' 2>/dev/null || echo "$METADATA" | head -5

          curl -sf -X PUT \
            -H "Authorization: Bearer ${ZENODO_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "${METADATA}" \
            "${ZENODO_URL}/api/deposit/depositions/${DRAFT_ID}"

          echo "=== Publishing ==="
          curl -sf -X POST \
            -H "Authorization: Bearer ${ZENODO_TOKEN}" \
            "${ZENODO_URL}/api/deposit/depositions/${DRAFT_ID}/actions/publish"

          DOI_URL=$(curl -sf \
            -H "Authorization: Bearer ${ZENODO_TOKEN}" \
            "${ZENODO_URL}/api/deposit/depositions/${DRAFT_ID}" \
            | jq -r '.doi_url')

          echo ""
          echo "✅ Published to Zenodo: $DOI_URL"
