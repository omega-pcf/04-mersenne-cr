name: Upload to Zenodo

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  upload-to-zenodo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo (for .zenodo.json)
        uses: actions/checkout@v4

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/release-assets
          gh release download "${{ github.event.release.tag_name }}" \
            --repo "${{ github.repository }}" \
            --pattern "*.zip" --dir /tmp/release-assets || true
          gh release download "${{ github.event.release.tag_name }}" \
            --repo "${{ github.repository }}" \
            --pattern "document-*.pdf" --pattern "checksums.txt" \
            --dir /tmp/release-assets || true
          echo "=== Files ===" && ls -la /tmp/release-assets/

      - name: Upload to Zenodo
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
          ZENODO_DEPOSITION_ID: ${{ secrets.ZENODO_DEPOSITION_ID }}
        run: |
          set -euxo pipefail
          Z="https://zenodo.org/api"

          api() {
            curl -sf -H "Authorization: Bearer ${ZENODO_TOKEN}" "$@"
          }

          DEPO_ID="${ZENODO_DEPOSITION_ID}"

          # ── Check if deposition exists and is published ──
          HTTP=$(curl -so /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${ZENODO_TOKEN}" \
            "${Z}/deposit/depositions/${DEPO_ID}")
          echo "Deposition ${DEPO_ID} → HTTP ${HTTP}"

          if [ "$HTTP" = "404" ]; then
            echo "=== Creating first deposition ==="
            RES=$(api -X POST "${Z}/deposit/depositions" \
              -d '{"metadata":{"title":"initial"}}')
            DEPO_ID=$(echo "$RES" | jq -r '.id')
            echo "Created: ${DEPO_ID}"
          fi

          STATE=$(api "${Z}/deposit/depositions/${DEPO_ID}" | jq -r '.state')
          echo "State: ${STATE}"

          # ── If draft (unsubmitted), publish it as v1 first ──
          if [ "$STATE" = "unsubmitted" ]; then
            echo "=== Publishing initial version ==="
            BUCKET=$(api "${Z}/deposit/depositions/${DEPO_ID}" | jq -r '.links.bucket')

            # Must upload at least one file to publish
            ZIP=$(find /tmp/release-assets -name "*.zip" | head -1)
            if [ -n "$ZIP" ]; then
              api -X PUT -H "Content-Type: application/octet-stream" \
                --data-binary "@${ZIP}" \
                "${BUCKET}/$(basename "${ZIP}")" > /dev/null
            else
              echo "initial" | api -X PUT -H "Content-Type: application/octet-stream" \
                --data-binary @- "${BUCKET}/placeholder.txt" > /dev/null
            fi

            # Set metadata
            TITLE=$(jq -r '.title // "untitled"' .zenodo.json)
            CREATORS=$(jq -c '.creators // [{"name":"placeholder"}]' .zenodo.json)
            api -X PUT -d "{
              \"metadata\": {
                \"title\": \"${TITLE}\",
                \"upload_type\": \"software\",
                \"publication_date\": \"$(date -u +%Y-%m-%d)\",
                \"description\": \"Initial deposition\",
                \"creators\": ${CREATORS}
              }
            }" "${Z}/deposit/depositions/${DEPO_ID}" > /dev/null

            api -X POST "${Z}/deposit/depositions/${DEPO_ID}/actions/publish" > /dev/null
            echo "✅ Initial version published"
            STATE="done"
          fi

          # ── Create new version ──
          echo "=== Creating new version ==="
          RES=$(api -X POST "${Z}/deposit/depositions/${DEPO_ID}/actions/newversion")
          NEW_ID=$(echo "$RES" | jq -r '.id')
          NEW_LINK=$(echo "$RES" | jq -r '.links.latest_draft')
          echo "New deposit: ${NEW_ID}, draft: ${NEW_LINK}"

          # ── Delete inherited files ──
          echo "=== Clearing inherited files ==="
          api "${Z}/deposit/depositions/${NEW_ID}/files" | jq -r '.[].id' | while read -r FID; do
            api -X DELETE "${Z}/deposit/depositions/${NEW_ID}/files/${FID}" > /dev/null 2>&1 || true
          done

          # ── Upload source zip ──
          echo "=== Uploading files ==="
          ZIP=$(find /tmp/release-assets -name "*.zip" | head -1)
          if [ -n "$ZIP" ]; then
            echo "  $(basename "$ZIP")"
            api -X PUT -H "Content-Type: application/octet-stream" \
              --data-binary "@${ZIP}" \
              "${Z}/deposit/depositions/${NEW_ID}/files/$(basename "$ZIP")" > /dev/null
          fi

          # ── Upload PDF + checksums ──
          find /tmp/release-assets -maxdepth 1 -type f -not -name "*.zip" | while read -r F; do
            echo "  $(basename "$F")"
            api -X PUT -H "Content-Type: application/octet-stream" \
              --data-binary "@${F}" \
              "${Z}/deposit/depositions/${NEW_ID}/files/$(basename "$F")" > /dev/null
          done

          # ── Set metadata from .zenodo.json ──
          echo "=== Setting metadata ==="
          METADATA=$(jq -n --slurpfile z .zenodo.json '{metadata: $z[0]}')
          api -X PUT -d "${METADATA}" "${Z}/deposit/depositions/${NEW_ID}" > /dev/null

          # ── Publish ──
          echo "=== Publishing ==="
          api -X POST "${Z}/deposit/depositions/${NEW_ID}/actions/publish" > /dev/null

          DOI_URL=$(api "${Z}/deposit/depositions/${NEW_ID}" | jq -r '.doi_url')
          echo ""
          echo "✅ Published: ${DOI_URL}"
