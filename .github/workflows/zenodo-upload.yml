name: Upload to Zenodo

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  upload-to-zenodo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo (for .zenodo.json)
        uses: actions/checkout@v4

      - name: Download release assets and source zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/zenodo-upload
          gh release download "${{ github.event.release.tag_name }}" \
            --repo "${{ github.repository }}" \
            --dir /tmp/zenodo-upload || true
          gh release download "${{ github.event.release.tag_name }}" \
            --repo "${{ github.repository }}" \
            --archive zip \
            --dir /tmp/zenodo-upload
          echo "=== Files ===" && ls -la /tmp/zenodo-upload/

      - name: Upload to Zenodo
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
          ZENODO_DEPOSITION_ID: ${{ secrets.ZENODO_DEPOSITION_ID }}
        run: |
          set -euxo pipefail
          Z="https://zenodo.org/api"

          api() {
            curl -s -H "Authorization: Bearer ${ZENODO_TOKEN}" "$@"
          }

          # ── Get or create deposition ──
          if [ -n "${ZENODO_DEPOSITION_ID:-}" ]; then
            # Verify it exists and is published
            HTTP=$(curl -so /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${ZENODO_TOKEN}" \
              "${Z}/deposit/depositions/${ZENODO_DEPOSITION_ID}")
            if [ "$HTTP" != "200" ]; then
              echo "Deposition ${ZENODO_DEPOSITION_ID} not found (HTTP ${HTTP}), creating new..."
              unset ZENODO_DEPOSITION_ID
            fi
          fi

          if [ -z "${ZENODO_DEPOSITION_ID:-}" ]; then
            echo "=== Creating new deposition ==="
            RES=$(api -X POST "${Z}/deposit/depositions" \
              -d '{}')
            ZENODO_DEPOSITION_ID=$(echo "$RES" | jq -r '.id')
            echo "Created deposition: ${ZENODO_DEPOSITION_ID}"
            echo "Set ZENODO_DEPOSITION_ID=${ZENODO_DEPOSITION_ID} in GitHub secrets"
          fi

          DEPO_ID="${ZENODO_DEPOSITION_ID}"
          STATE=$(api "${Z}/deposit/depositions/${DEPO_ID}" | jq -r '.state')
          echo "State: ${STATE}"

          # ── Handle draft (first time) ──
          if [ "${STATE}" = "unsubmitted" ]; then
            echo "=== Publishing first version ==="
            TITLE=$(jq -r '.title // "untitled"' .zenodo.json)
            CREATORS=$(jq -c '.creators // [{"name":"placeholder"}]' .zenodo.json)

            echo "placeholder" > /tmp/zenodo-upload/placeholder.txt
            curl -s -X POST \
              -H "Authorization: Bearer ${ZENODO_TOKEN}" \
              -F "name=placeholder.txt" \
              -F "file=@/tmp/zenodo-upload/placeholder.txt" \
              "${Z}/deposit/depositions/${DEPO_ID}/files" | jq -r '.filename'

            api -X PUT -d "{
              \"metadata\": {
                \"title\": \"${TITLE}\",
                \"upload_type\": \"software\",
                \"publication_date\": \"$(date -u +%Y-%m-%d)\",
                \"description\": \"Initial deposition\",
                \"creators\": ${CREATORS}
              }
            }" "${Z}/deposit/depositions/${DEPO_ID}" > /dev/null

            api -X POST "${Z}/deposit/depositions/${DEPO_ID}/actions/publish" > /dev/null
            echo "✅ Published first version"
            STATE="done"
          fi

          # ── Create new version ──
          echo "=== Creating new version ==="
          RES=$(api -X POST "${Z}/deposit/depositions/${DEPO_ID}/actions/newversion")
          NEW_ID=$(echo "$RES" | jq -r '.id')
          echo "New draft: ${NEW_ID}"

          # ── Delete inherited files ──
          echo "=== Clearing inherited files ==="
          api "${Z}/deposit/depositions/${NEW_ID}/files" | jq -r '.[].id' | while read -r FID; do
            api -X DELETE "${Z}/deposit/depositions/${NEW_ID}/files/${FID}" > /dev/null 2>&1 || true
          done

          # ── Upload all files via POST multipart ──
          echo "=== Uploading files ==="
          find /tmp/zenodo-upload -maxdepth 1 -type f -not -name "placeholder.txt" | while read -r F; do
            echo "  $(basename "$F")"
            curl -s -X POST \
              -H "Authorization: Bearer ${ZENODO_TOKEN}" \
              -F "name=$(basename "$F")" \
              -F "file=@${F}" \
              "${Z}/deposit/depositions/${NEW_ID}/files" | jq -r '.filename // .message'
          done

          # ── Set metadata ──
          echo "=== Setting metadata ==="
          METADATA=$(jq -n --slurpfile z .zenodo.json '{metadata: $z[0]}')
          api -X PUT -d "${METADATA}" "${Z}/deposit/depositions/${NEW_ID}" > /dev/null

          # ── Publish ──
          echo "=== Publishing ==="
          api -X POST "${Z}/deposit/depositions/${NEW_ID}/actions/publish" > /dev/null

          DOI_URL=$(api "${Z}/deposit/depositions/${NEW_ID}" | jq -r '.doi_url')
          echo ""
          echo "✅ Published: ${DOI_URL}"
          echo ""
          echo "💡 Save this for next run: ZENODO_DEPOSITION_ID=${DEPO_ID}"
